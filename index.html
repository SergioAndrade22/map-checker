<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChromaMap - Realtime World Map Categorizer</title>
    <meta name="description" content="Categorize world countries with custom colors and labels, add personal notes, and collaborate or compare in real-time." />
    <meta property="og:title" content="ChromaMap - Realtime World Map Categorizer" />
    <meta property="og:description" content="Categorize world countries with custom colors and labels, add personal notes, and collaborate or compare in real-time." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // GitHub Pages SPA route restoration
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
